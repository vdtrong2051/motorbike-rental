name: GD3 Reviews
on:
  push:
    branches: [develop]
  workflow_dispatch:
jobs:
  reviews:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gd3_disposable_root
          MYSQL_DATABASE: RentalPlatformDb
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgd3_disposable_root"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5120
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=RentalPlatformDb;User=root;Password=gd3_disposable_root;CharSet=utf8mb4;SslMode=Disabled'
      GD3_TEST_DATABASE: I_UNDERSTAND_DISPOSABLE
      GD3_FIXTURE_PATH: /tmp/gd3-http-fixture.json
      SeedAdmin__Email: gd3-admin@example.test
      SeedAdmin__Password: GD3_Admin_Test_2026!
      SeedAdmin__Name: GD3 Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build GD3 and application
        run: |
          dotnet restore tests/Gd3.Reviews.Tests/Gd3.Reviews.Tests.csproj
          dotnet build tests/Gd3.Reviews.Tests/Gd3.Reviews.Tests.csproj -c Release --no-restore
      - name: Initialize existing schema with accepted GD2 EF model
        run: bash scripts/ci/init-baseline-schema.sh
      - name: Add independent GD3 SQL table on disposable database
        run: dotnet run --project tests/Gd3.Reviews.Tests/Gd3.Reviews.Tests.csproj -c Release --no-build -- init-schema
      - name: Run real MySQL review integration tests
        run: dotnet run --project tests/Gd3.Reviews.Tests/Gd3.Reviews.Tests.csproj -c Release --no-build -- core-tests
      - name: Seed role-scoped HTTP fixtures
        run: dotnet run --project tests/Gd3.Reviews.Tests/Gd3.Reviews.Tests.csproj -c Release --no-build -- seed-http
      - name: Run Customer Owner Admin HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project RentalPlatform/RentalPlatform.csproj -c Release --no-build --no-launch-profile > /tmp/gd3-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5120/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/gd3-app.log; exit 1; fi
          python3 tests/gd3_review_smoke.py "$GD3_FIXTURE_PATH"
      - name: App logs on failure
        if: failure()
        run: cat /tmp/gd3-app.log || true
